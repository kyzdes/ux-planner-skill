<style>
  :root {
    --shell-bg: #0E0D0C;
    --stage-bg: #14130F;
    --sidebar-bg: #18161A;
    --sidebar-edge: #2A2528;
    --sidebar-ink: #E8E5E0;
    --sidebar-muted: #8C8579;
    --sidebar-dim: #4E4A46;
    --accent: #E47A5C;
    --accent-dim: #A04D38;
    --chrome-bg: #2E2A26;
    --chrome-edge: #3D3833;
    --chrome-text: #B5AFA5;
    --screen-bg: #F5EFE6;
    --screen-ink: #1A1714;
    --screen-muted: #5C5851;
    --touched: #6FA37A;

    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--shell-bg);
    color: var(--sidebar-ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    height: 100vh;

  button { font-family: inherit; cursor: pointer; }
  code { font-family: var(--mono); font-size: 12px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2D2A26; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #3D3833; }

  /* =============== SHELL =============== */

  .canvas-shell {
    display: grid;
    grid-template-columns: 1fr 384px;
    height: 100vh;
    width: 100vw;
  }

  /* =============== STAGE =============== */

  .stage {
    background: var(--stage-bg);
    overflow-y: auto;
    padding: 32px 40px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .stage-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 1280px;
    gap: 16px;
  }

  .section-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #1A1816;
    border: 1px solid var(--sidebar-edge);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sidebar-ink);
  }
  .section-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(228, 122, 92, 0.18);
  }
  .section-pill .pill-name { color: var(--sidebar-muted); }
  .section-pill .alt-tag { color: var(--accent); margin-left: 6px; }

  /* browser chrome */
  .browser-chrome {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--chrome-bg);
    border: 1px solid var(--chrome-edge);
    border-radius: 10px 10px 0 0;

  .traffic-lights { display: flex; gap: 7px; }
  .traffic-lights span {
    width: 12px; height: 12px; border-radius: 50%;

  }
  .tl-red { background: #FF5F57; }
  .tl-yellow { background: #FFBD2E; }
  .tl-green { background: #28C840; }
  .url-bar {
    flex: 1;
    display: flex;
    align-items: center;

    max-width: 1280px;

  .ph-meta { color: var(--screen-muted); font-size: 13px; margin-bottom: 24px; }

  .ph-alt {
    margin-top: 24px;
    padding: 12px 18px;
    background: #FFE6DC;
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-size: 13px;
    color: var(--accent-dim);
    font-weight: 500;
  }

  /* =============== SIDEBAR =============== */

  .sidebar {
    background: var(--sidebar-bg);
    border-left: 1px solid var(--sidebar-edge);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px 20px;

  .sidebar-header { margin-bottom: 20px; }
  .sidebar-header .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;

    font-family: var(--mono);

    color: var(--sidebar-dim);

    font-family: var(--mono);
    font-size: 10px;

    color: var(--sidebar-muted);

  /* tweaks */

  .tg-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--sidebar-ink);

    font-family: var(--mono);

    flex: 1;
    min-width: 0;

  /* flow steps */
  .flow-steps { display: flex; flex-direction: column; gap: 4px; }

  .flow-step.active {
    background: rgba(228, 122, 92, 0.08);

  .step-dot {

  .step-id { font-family: var(--mono); font-size: 11px; color: var(--sidebar-dim); }
  .flow-step.active .step-id { color: var(--accent); }
  .step-name { font-size: 12px; }
  .step-role { font-family: var(--mono); font-size: 10px; color: var(--sidebar-dim); letter-spacing: 0.06em; }

  /* alt states */
  .alt-states { display: flex; flex-direction: column; gap: 6px; }
  .alt-state {
    text-align: left;
    background: transparent;
    border: 1px solid var(--sidebar-edge);

    color: var(--sidebar-muted);

  .alt-state.active { border-color: var(--accent); background: rgba(228, 122, 92, 0.07); color: var(--sidebar-ink); }
  .as-head { display: flex; gap: 6px; align-items: baseline; margin-bottom: 3px; font-size: 12px; }
  .as-section { font-family: var(--mono); font-size: 10px; color: var(--sidebar-dim); }

  /* meta footer */
  .meta-footer {

  .meta-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);

    color: var(--sidebar-dim);
    padding: 3px 0;
    letter-spacing: 0.08em;
  }
  .meta-row .key { color: var(--sidebar-muted); }
  .meta-row .val { color: var(--sidebar-ink); }

  /* copy bar */
  .copy-bar {
    padding: 14px 18px 16px;
    background: #131115;
    border-top: 1px solid var(--sidebar-edge);

  .copy-btn {
    width: 100%;
    padding: 12px 14px;
    background: var(--accent);
    color: #1A1714;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;

    background: #2A2528;

    margin-top: 8px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--sidebar-dim);
    line-height: 1.4;

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--sidebar-ink);

    border-radius: 999px;

    font-weight: 500;

<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useCallback } = React;

/* ============================================================
   SPEC METADATA · HUASHU: REPLACE WITH VALUES FROM SPEC §1 / §7 / §8.2
   ============================================================ */
const SPEC_PATH = '/absolute/path/to/ux-spec-YYYY-MM-DD-product.md';
const PRODUCT_DOMAIN = 'example.com/';
const DESIGN_SYSTEM = '—';
const DENSITY = 'RESTRAINED'; // 'RESTRAINED' | 'HIGH-DENSITY'

/* ============================================================
   SCREENS · HUASHU: REPLACE — mirror §4 Screen Inventory
   ============================================================ */
const SCREENS = [
  { id: 'S1', name: 'Home',   role: 'hero',       anchor: '' },
  { id: 'S2', name: 'Detail', role: 'data',       anchor: 'detail/123' },
  { id: 'S3', name: 'Settings', role: 'end',      anchor: 'settings' },
];

/* ============================================================
   TWEAKS · HUASHU: REPLACE — mirror §8.5 (every entry MUST have a scope)
   - scope: ['global']  → applies everywhere, shown on every screen
   - scope: ['S1', 'S2'] → applies only when those screens are active
   - dim: <n>           → cross-reference §8.4 dimension number (optional)
   ============================================================ */
const TWEAKS = [
  {
    id: 'primary-color',
    label: 'Primary color',
    scope: ['global'],
    dim: 1,
    options: [{ v: 'rust', l: 'Rust' }, { v: 'teal', l: 'Teal' }, { v: 'charcoal', l: 'Charcoal' }],
    default: 'rust',
  },
  {
    id: 'global-density',
    label: 'Density',
    scope: ['global'],
    dim: 2,
    options: [{ v: 'compact', l: 'Compact' }, { v: 'comfortable', l: 'Comfortable' }, { v: 'spacious', l: 'Spacious' }],
    default: 'comfortable',
  },
  {
    id: 'home-layout',
    label: 'Home layout',
    scope: ['S1'],
    dim: 3,
    options: [{ v: 'list', l: 'List' }, { v: 'grid', l: 'Grid' }, { v: 'calendar', l: 'Calendar' }],
    default: 'list',
  },
  {
    id: 'detail-pane',
    label: 'Detail pane',
    scope: ['S2'],
    options: [{ v: 'push', l: 'Push' }, { v: 'modal', l: 'Modal' }, { v: 'side', l: 'Side panel' }],
    default: 'push',
  },
  {
    id: 'settings-ia',
    label: 'Settings IA',
    scope: ['S3'],
    options: [{ v: 'flat', l: 'Flat list' }, { v: 'grouped', l: 'Grouped' }, { v: 'tabbed', l: 'Tabbed' }],
    default: 'grouped',
  },
];

/* ============================================================
   ALT STATES · HUASHU: REPLACE — mirror §5 non-success states + §9.4 risks
   ============================================================ */
const ALT_STATES = [
  { id: 'empty-S1', screen: 'S1', name: 'Empty state',  detail: 'No data yet — CTA to add first item' },
  { id: 'error-S2', screen: 'S2', name: 'Load error',   detail: 'Network failed — inline retry available' },
  { id: 'saved-S3', screen: 'S3', name: 'Saved toast',  detail: 'Settings change confirmed inline' },
];

/* ============================================================
   FLOW · HUASHU: REPLACE — mirror §3 primary flow steps
   For multi-flow products, replace with the flow you want to visualize first
   ============================================================ */
const FLOW_STEPS = SCREENS;

/* ============================================================
   STATE HELPERS · v1.3 cross-screen accumulator
   DO NOT CHANGE this section unless you understand the §8.7 contract
   ============================================================ */

function tweakKey(tweak) {
  return tweak.scope.join(',') + '|' + tweak.id;
}

function initialTweakState() {
  const s = {};
  for (const t of TWEAKS) s[t.id] = t.default;
  return s;
}

function tweaksForScreen(screenId) {
  return TWEAKS.filter(t => t.scope.includes('global') || t.scope.includes(screenId));
}

function valueLabel(tweak, v) {
  const opt = tweak.options.find(o => o.v === v);
  return opt ? opt.l : v;
}

function countDistinctScreenScopes(touchedKeys) {
  // counts SCREEN scopes only — 'global' is its own bucket, not a "screen"
  const screens = new Set();
  for (const t of TWEAKS) {
    if (!touchedKeys.has(tweakKey(t))) continue;
    for (const s of t.scope) {
      if (s !== 'global') screens.add(s);
    }
  }
  return screens.size;
}

/* ============================================================
   LOCK-IN PROMPT · v1.3 multi-block (§8.8)
   - Emit optional Global: block first
   - Then one Screen Sx · Name: block per screen with touched picks
   - Screens ordered by S-id ascending
   - Within each block: §8.5 declaration order
   - Skip blocks with zero touched keys
   ============================================================ */

function buildLockInPrompt(touchedKeys, tweakState) {
  const global = [];
  const perScreen = {};

  for (const t of TWEAKS) {
    if (!touchedKeys.has(tweakKey(t))) continue;
    const v = valueLabel(t, tweakState[t.id]);
    const head = t.dim != null ? `§8.4 DIM ${t.dim} ${t.label}` : t.label;
    const line = `- ${head}: ${v}`;
    if (t.scope.includes('global')) {
      global.push(line);
    } else {
      for (const sid of t.scope) {
        if (!perScreen[sid]) perScreen[sid] = [];
        perScreen[sid].push(line);
      }
    }
  }

  const parts = [`Lock these design choices into the UX spec at ${SPEC_PATH}:`, ''];

  if (global.length > 0) {
    parts.push('Global:');
    parts.push(...global);
    parts.push('');
  }

  for (const sid of Object.keys(perScreen).sort()) {
    const screen = SCREENS.find(s => s.id === sid);
    const name = screen ? screen.name : sid;
    parts.push(`Screen ${sid} · ${name}:`);
    parts.push(...perScreen[sid]);
    parts.push('');
  }

  parts.push(
    'Action: update §8.4 — mark these variants as "locked" (globally for Global block, per-screen for Screen blocks) ' +
    'and move non-chosen variants to §9.5 Considered Alternatives. ' +
    'If the same DIM is locked to different variants across blocks, do NOT lock — record the conflict in §9.5 ' +
    'and surface it back to the user. Re-run §6 self-review and regenerate the §8 hand-off phrase.'
  );

  return parts.join('\n');
}

/* ============================================================
   COMPONENTS
   ============================================================ */

function TweaksPanel({ activeScreenId, tweakState, setTweakState, touchedKeys, setTouchedKeys }) {
  const visible = tweaksForScreen(activeScreenId);
  const sectionScoped = visible.filter(t => !t.scope.includes('global'));
  const globalScoped = visible.filter(t => t.scope.includes('global'));

  const toggle = (tweak, value) => {
    setTweakState(s => ({ ...s, [tweak.id]: value }));
    setTouchedKeys(prev => {
      const next = new Set(prev);
      next.add(tweakKey(tweak));
      return next;
    });
  };

  const renderGroup = (t) => {
    const touched = touchedKeys.has(tweakKey(t));
    return (
      <div key={t.id} className="tweak-group">
        <div className="tg-label">
          {t.dim != null && <span className="tg-dim">§8.4 DIM {t.dim}</span>}
          <span>{t.label}</span>
          {touched && <span className="tg-touched">· touched</span>}
        </div>
        <div className="tg-scope">scope: {t.scope.join(', ')}</div>
        <div className="tweak-options">
          {t.options.map(opt => (
            <button
              key={opt.v}
              className={tweakState[t.id] === opt.v ? 'selected' : ''}
              onClick={() => toggle(t, opt.v)}
            >
              {opt.l}
            </button>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div className="block">
      <div className="block-title">
        <span>Tweaks · filtered for {activeScreenId}</span>
        <span className="count">{visible.length}</span>
      </div>
      {sectionScoped.map(renderGroup)}
      {globalScoped.length > 0 && (
        <>
          <div className="block-subtitle">Global (apply across all screens)</div>
          {globalScoped.map(renderGroup)}
        </>
      )}
    </div>
  );
}

function FlowStepsPanel({ activeScreenId, onPickScreen }) {
  return (
    <div className="block">
      <div className="block-title">
        <span>Flow steps</span>
        <span className="count">{FLOW_STEPS.length}</span>
      </div>
      <div className="flow-steps">
        {FLOW_STEPS.map(s => (
          <button
            key={s.id}
            className={`flow-step ${s.id === activeScreenId ? 'active' : ''}`}
            onClick={() => onPickScreen(s.id)}
          >
            <span className="step-dot" />

            <span className="step-name">{s.name}</span>
            <span className="step-role">{s.role}</span>

}

function AlternateStatesPanel({ activeAltState, setActiveAltState, setActiveScreenId }) {

function MetaFooter() {
  const sourceName = SPEC_PATH.split('/').pop();
  return (
    <div className="meta-footer">

      <div className="meta-row"><span className="key">SYSTEM</span><span className="val">{DESIGN_SYSTEM}</span></div>
      <div className="meta-row"><span className="key">DENSITY</span><span className="val">{DENSITY}</span></div>
    </div>

}

function CopyLockInButton({ touchedKeys, tweakState, onToast }) {
  const [copied, setCopied] = useState(false);
  const count = touchedKeys.size;
  const screens = countDistinctScreenScopes(touchedKeys);
  const empty = count === 0;

  const handleCopy = async () => {
    if (empty) {
      onToast('Pick at least one tweak before copying');
      return;
    }
    const text = buildLockInPrompt(touchedKeys, tweakState);
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (e) {
      // file:// permission fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        ok = document.execCommand('copy');
      } catch (err) { ok = false; }
      document.body.removeChild(ta);
    }
    if (!ok) {
      alert('Clipboard blocked. Copy this manually:\n\n' + text);
      return;
    }
    setCopied(true);
    onToast(`Copied · ${count} picks across ${screens} screens`);
    setTimeout(() => setCopied(false), 2000);
  };

  const label = empty
    ? 'Copy lock-in prompt · no picks yet'
    : `Copy lock-in prompt · ${count} picks across ${screens} screens`;

  return (
    <div className="copy-bar">
      <button
        className={`copy-btn ${copied ? 'copied' : ''} ${empty ? 'empty' : ''}`}
        onClick={handleCopy}
      >
        {copied ? '✓ Copied to clipboard' : label}
      </button>
      <div className="copy-help">
        Picks persist across screens · one Copy = whole iteration locked back into §8.4
      </div>
    </div>
  );
}

function ScreenPreview({ activeScreenId, tweaks, altState }) {
  const screen = SCREENS.find(s => s.id === activeScreenId);
  if (!screen) return null;
  const visibleTweaks = tweaksForScreen(activeScreenId);
  const alt = altState ? ALT_STATES.find(a => a.id === altState) : null;

  return (
    <div className="screen-placeholder">
      <div className="ph-eyebrow">[ HUASHU: REPLACE with §5 brief for {activeScreenId} ]</div>
      <h1 className="ph-title">{screen.name}</h1>
      <div className="ph-meta">narrative role: {screen.role} · scope-filtered tweaks below</div>
      <div className="ph-tweaks">
        <strong>Active tweak values on this screen:</strong>
        <ul>
          {visibleTweaks.map(t => (
            <li key={t.id}>
              {t.label} <code>[{t.scope.join(', ')}]</code>: <code>{valueLabel(t, tweaks[t.id])}</code>
            </li>
          ))}
        </ul>
      </div>
      {alt && (
        <div className="ph-alt">
          ALT STATE: {alt.name} — {alt.detail}
        </div>
      )}
    </div>
  );
}
